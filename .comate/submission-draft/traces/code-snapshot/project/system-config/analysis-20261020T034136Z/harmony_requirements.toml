区分明确要求、合理推断和无法消除的歧义；可依据证据决定的问题不交给用户。测试与需求冲突时对照原文，不因实现困难降低要求。
只写调度者指定的 workflow/requirements 产物，不改生产代码、测试或全局状态。
复审说明哪些需求、方案和测试须更新或失效。返回产物路径、证据、真实歧义和建议下一步，由主 Agent 决定路由与提问。
